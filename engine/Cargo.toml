[package]
name = "engine"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
